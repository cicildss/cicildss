<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 70" width="100%" height="100%" role="img" aria-labelledby="title desc">
<title id="title">Maria Cecília Teixeira</title><desc id="desc">Assinatura visual com uma linha vinho animada.</desc>
<rect width="900" height="70" fill="#F0EAE1" rx="4"/><rect width="7" height="70" fill="#8F263D"/>
<text x="30" y="29" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#8F263D">MARIA CECÍLIA TEIXEIRA</text>
<text x="30" y="49" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#171416">Negócio bem entendido. Solução bem construída.</text>
<text x="865" y="39" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#625A56">CONTROLADORIA × TECNOLOGIA</text>
<path d="M30 62H870" stroke="#D8C9BE" stroke-width="1"/>
<path d="M30 62H870" stroke="#8F263D" stroke-width="2" stroke-linecap="round" stroke-dasharray="90 750">
  <animate attributeName="stroke-dashoffset" values="840;0" dur="4.5s" repeatCount="indefinite"/>
</path>
<circle r="3" cy="62" fill="#B4475A"><animate attributeName="cx" values="30;870;30" dur="4.5s" repeatCount="indefinite"/></circle>
</svg>