<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
      .footer-line { stroke: #EAEAEA; stroke-width: 1; }
      .footer-text { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10.5px; font-weight: 600; fill: #777777; letter-spacing: 2px; }
      .highlight { fill: #171717; font-weight: 700; }
      .accent-dot { fill: #D989A8; }
    </style>
  </defs>
  <line x1="30" y1="30" x2="180" y2="30" class="footer-line" />
  <circle cx="190" cy="30" r="2.5" class="accent-dot" />
  <text x="450" y="34" text-anchor="middle" class="footer-text">
    BUILDING WHERE BUSINESS MEETS TECHNOLOGY <tspan class="highlight">· MARIA CECÍLIA TEIXEIRA</tspan>
  </text>
  <circle cx="710" cy="30" r="2.5" class="accent-dot" />
  <line x1="720" y1="30" x2="870" y2="30" class="footer-line" />
</svg>
