<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&amp;family=Playfair+Display:ital,wght@0,600;1,400&amp;display=swap');
      .bg { fill: #101014; }
      .border { stroke: #29262D; stroke-width: 1; fill: none; }
      .grid-line { stroke: #29262D; stroke-width: 1; stroke-dasharray: 4 4; }
      .tag { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 3px; fill: #B9B0B6; }
      .title { font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 600; fill: #F4F0F2; letter-spacing: 1.5px; }
      .subtitle { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; fill: #D989A8; letter-spacing: 3px; }
      .accent-box { fill: #492A39; opacity: 0.8; }
      .accent-dot { fill: #D989A8; }
      .line-accent { stroke: #D989A8; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="900" height="240" rx="8" class="bg" />
  <rect x="1" y="1" width="898" height="238" rx="7" class="border" />
  <line x1="60" y1="0" x2="60" y2="240" class="grid-line" />
  <line x1="840" y1="0" x2="840" y2="240" class="grid-line" />
  <line x1="0" y1="50" x2="900" y2="50" class="grid-line" />
  <line x1="0" y1="190" x2="900" y2="190" class="grid-line" />
  <rect x="740" y="70" width="40" height="40" class="accent-box" rx="4" />
  <circle cx="780" cy="130" r="18" stroke="#D989A8" stroke-width="1" fill="none" />
  <circle cx="730" cy="140" r="3" class="accent-dot" />
  <line x1="720" y1="80" x2="790" y2="80" class="line-accent" />
  <circle cx="60" cy="50" r="3" class="accent-dot" />
  <circle cx="840" cy="50" r="3" class="accent-dot" />
  <circle cx="60" cy="190" r="3" fill="#F4F0F2" />
  <circle cx="840" cy="190" r="3" fill="#F4F0F2" />
  <text x="90" y="88" class="tag">DATA · PROCESS · TECHNOLOGY · AUTOMATION</text>
  <text x="90" y="132" class="title">MARIA CECÍLIA TEIXEIRA</text>
  <text x="90" y="162" class="subtitle">ANALISTA DE CONTROLADORIA</text>
</svg>