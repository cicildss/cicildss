  <path d="M0 288 C230 235 340 345 540 288 S870 242 1200 280" fill="none" stroke="#B4475A" stroke-opacity=".18"/>
  <path d="M0 302 C230 249 340 359 540 302 S870 256 1200 294" fill="none" stroke="#B4475A" stroke-opacity=".1"/>
