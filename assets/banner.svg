  <text x="72" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#F4EFEA">Maria Cecília</text>
  <text x="72" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#F4EFEA">Teixeira<tspan fill="#B4475A">.</tspan></text>
