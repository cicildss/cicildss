<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Maria Cecília Teixeira</title>
  <desc id="desc">Controladoria, dados, processos e tecnologia com uma abordagem estratégica e autoral.</desc>
  <defs>
