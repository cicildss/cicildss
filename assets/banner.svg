    <circle cx="130" cy="5" r="4" fill="#F4F0F2"/>
    <circle cx="219" cy="94" r="4" fill="#D989A8"/>
    <circle cx="130" cy="183" r="4" fill="#D989A8"/>
    <circle cx="41" cy="94" r="4" fill="#F4F0F2"/>
    <path d="M36 213 L76 213 L96 193 L128 193 L153 164 L184 164 L204 142 L229 142" fill="none" stroke="#D989A8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
