  <text x="74" y="247" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.1" fill="#F4EFEA">CONTROLADORIA &amp; TRANSFORMAÇÃO DIGITAL</text>
  <text x="74" y="273" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing=".65" fill="#BEB3B1">Processos mais inteligentes. Dados que orientam. Resultados que importam.</text>
