      <stop offset=".58" stop-color="#171416"/>
      <stop offset="1" stop-color="#28151B"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D77A87"/>
      <stop offset="1" stop-color="#8F263D"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#F4EFEA" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
