<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Maria Cecília Teixeira</title>
  <desc id="desc">Controladoria, business intelligence, processos e tecnologia.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0D10"/>
      <stop offset="0.6" stop-color="#151219"/>
      <stop offset="1" stop-color="#21151D"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1B6CC"/>
      <stop offset="1" stop-color="#C96F96"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#FFFFFF" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="330" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="14" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="328" rx="13" fill="none" stroke="#51404A" stroke-opacity=".7"/>
  <circle cx="1010" cy="150" r="104" fill="#D989A8" opacity=".08" filter="url(#glow)"/>
  <path d="M0 275 C220 225 320 350 520 285 S860 230 1200 278" fill="none" stroke="#D989A8" stroke-opacity=".13" stroke-width="1"/>
  <path d="M0 290 C220 240 320 365 520 300 S860 245 1200 293" fill="none" stroke="#D989A8" stroke-opacity=".09" stroke-width="1"/>
  <rect x="72" y="48" width="5" height="26" rx="2.5" fill="url(#pink)"/>
  <text x="92" y="65" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2" fill="#D989A8">BUSINESS  /  DATA  /  SYSTEMS</text>
  <text x="72" y="139" font-family="Georgia, 'Times New Roman', serif" font-size="47" font-weight="400" letter-spacing=".3" fill="#F7F1F4">Maria Cecília</text>
  <text x="72" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="47" font-weight="400" letter-spacing=".3" fill="#F7F1F4">Teixeira<tspan fill="#D989A8">.</tspan></text>
  <line x1="74" y1="218" x2="370" y2="218" stroke="#D989A8" stroke-width="1.5"/>
  <text x="74" y="247" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2.3" fill="#F4F0F2">CONTROLADORIA &amp; TRANSFORMAÇÃO DIGITAL</text>
  <text x="74" y="273" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.1" fill="#BDB2B9">Processos mais inteligentes. Dados que orientam. Resultados que importam.</text>
  <g transform="translate(835 64)">
    <circle cx="130" cy="94" r="89" fill="none" stroke="#D989A8" stroke-opacity=".32" stroke-width="1"/>
    <circle cx="130" cy="94" r="70" fill="none" stroke="#D989A8" stroke-opacity=".2" stroke-width="1" stroke-dasharray="3 7"/>
