<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="100%" height="100%" role="img" aria-labelledby="title desc">
<title id="title">Meu método de trabalho</title><desc id="desc">Quatro etapas: entender, estruturar, automatizar e mensurar, conectadas por um indicador animado.</desc>
<defs><linearGradient id="line" x1="0" x2="1"><stop stop-color="#8F263D"/><stop offset=".5" stop-color="#D77A87"/><stop offset="1" stop-color="#E8CBA5"/></linearGradient></defs>
<rect width="900" height="190" rx="7" fill="#171416"/>
<rect x="0" y="0" width="8" height="190" fill="#8F263D"/>
<text x="32" y="31" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" letter-spacing="2.2" fill="#D77A87">MEU MÉTODO / DO DIAGNÓSTICO AO IMPACTO</text>
<g font-family="Arial,Helvetica,sans-serif">
<g transform="translate(32 53)"><rect width="198" height="104" fill="#211B1D" stroke="#554047"/><text x="14" y="24" font-size="10" fill="#D77A87">01 / INVESTIGAÇÃO</text><text x="14" y="53" font-family="Georgia,serif" font-size="23" fill="#F0EAE1">Entender</text><text x="14" y="78" font-size="11" fill="#BEB3B1">Contexto, causa e dados</text></g>
<path d="M236 105h15" stroke="#B4475A" stroke-width="2"/><path d="M246 100l5 5-5 5" fill="none" stroke="#B4475A" stroke-width="2"/>
<g transform="translate(260 53)"><rect width="198" height="104" fill="#211B1D" stroke="#554047"/><text x="14" y="24" font-size="10" fill="#D77A87">02 / DESENHO</text><text x="14" y="53" font-family="Georgia,serif" font-size="23" fill="#F0EAE1">Estruturar</text><text x="14" y="78" font-size="11" fill="#BEB3B1">Processos e controles</text></g>
<path d="M464 105h15" stroke="#B4475A" stroke-width="2"/><path d="M474 100l5 5-5 5" fill="none" stroke="#B4475A" stroke-width="2"/>
<g transform="translate(488 53)"><rect width="178" height="104" fill="#211B1D" stroke="#554047"/><text x="14" y="24" font-size="10" fill="#D77A87">03 / EXECUÇÃO</text><text x="14" y="53" font-family="Georgia,serif" font-size="22" fill="#F0EAE1">Automatizar</text><text x="14" y="78" font-size="11" fill="#BEB3B1">Sistemas e soluções</text></g>
<path d="M672 105h15" stroke="#B4475A" stroke-width="2"/><path d="M682 100l5 5-5 5" fill="none" stroke="#B4475A" stroke-width="2"/>
<g transform="translate(696 53)"><rect width="172" height="104" fill="#351923" stroke="#8F263D"/><text x="14" y="24" font-size="10" fill="#D77A87">04 / RESULTADO</text><text x="14" y="53" font-family="Georgia,serif" font-size="23" fill="#F0EAE1">Mensurar</text><text x="14" y="78" font-size="11" fill="#BEB3B1">Indicadores e impacto</text></g>
</g>
<path d="M40 169H860" fill="none" stroke="#554047" stroke-width="1"/>
<path d="M40 169H860" fill="none" stroke="url(#line)" stroke-width="2" stroke-dasharray="42 780">
  <animate attributeName="stroke-dashoffset" values="820;0" dur="5s" repeatCount="indefinite"/>
</path>
<circle r="4" fill="#E8CBA5">
  <animateMotion dur="5s" repeatCount="indefinite" path="M40 169 H860"/>
</circle>
<circle r="9" fill="#B4475A" opacity=".18"><animateMotion dur="5s" repeatCount="indefinite" path="M40 169 H860"/></circle>
</svg>